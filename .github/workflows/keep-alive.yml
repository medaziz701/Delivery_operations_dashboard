name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 8 */2 * *'  # tous les 2 jours à 8h UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://akeuwxezhbrrojgktybl.supabase.co/rest/v1/keywords?select=*&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP $code"
          [ "$code" = "200" ]
