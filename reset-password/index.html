<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quick Delivery | إعادة تعيين كلمة المرور</title>
  <script>
    (function () {
      try {
        var to = new URL('../reset-password.html', window.location.href);
        to.search = window.location.search || '';
        to.hash = window.location.hash || '';
        window.location.replace(to.toString());
      } catch (e) {
        // Fallback
        window.location.href = '../reset-password.html';
      }
    })();
  </script>
</head>
<body></body>
</html>
