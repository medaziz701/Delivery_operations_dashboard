<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quick Delivery | إعادة تعيين كلمة المرور</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="assets/css/styles.css?v=20260128-1" />
  <link rel="icon" href="assets/img/logo-quick-delivery.png" type="image/png" />
</head>
<body data-page="reset-password" class="theme-dark theme-minimal bg-soft">
  <nav class="navbar bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <img src="assets/img/logo-quick-delivery.png" alt="Quick Delivery" class="me-1" style="height:24px" />
        Quick Delivery
      </a>
    </div>
  </nav>

  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h1 class="h4 fw-bold mb-2">إعادة تعيين كلمة المرور</h1>
              <p class="text-muted mb-4">أدخل كلمة مرور جديدة لحسابك.</p>

              <div id="resetAlert" class="alert alert-danger d-none" role="alert"></div>
              <div id="resetOk" class="alert alert-success d-none" role="alert"></div>

              <form id="resetForm" novalidate>
                <div class="mb-3">
                  <label class="form-label">كلمة مرور جديدة</label>
                  <div class="input-group">
                    <input id="resetPw1" type="password" class="form-control" minlength="6" required />
                    <button class="btn btn-outline-secondary" type="button" aria-label="إظهار/إخفاء كلمة المرور" data-toggle-password="resetPw1">
                      <i class="bi bi-eye"></i>
                    </button>
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label">تأكيد كلمة المرور</label>
                  <div class="input-group">
                    <input id="resetPw2" type="password" class="form-control" minlength="6" required />
                    <button class="btn btn-outline-secondary" type="button" aria-label="إظهار/إخفاء كلمة المرور" data-toggle-password="resetPw2">
                      <i class="bi bi-eye"></i>
                    </button>
                  </div>
                </div>

                <button id="resetSaveBtn" class="btn btn-primary w-100" type="submit">حفظ كلمة المرور الجديدة</button>
              </form>

              <div class="text-center mt-3">
                <a href="index.html?login=1" class="link-secondary small">العودة لتسجيل الدخول</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>

  <script src="assets/js/utils.js?v=20260128-1" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="supabase-config.js?v=20260128-1" defer></script>
  <script src="assets/js/supabase.js?v=20260128-1" defer></script>
  <script src="assets/js/auth.js?v=20260128-1" defer></script>
  <script src="assets/js/app.js?v=20260128-1" defer></script>
</body>
</html>
