<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quick Delivery | تسجيل الدخول</title>

  <script>
    (function () {
      try {
        var url = new URL(window.location.href);
        var next = url.searchParams.get('next') || '';
        var reason = url.searchParams.get('reason') || '';
        var params = new URLSearchParams();
        params.set('login', '1');
        if (next) params.set('next', next);
        if (reason) params.set('reason', reason);
        window.location.replace('index.html?' + params.toString());
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="assets/css/styles.css?v=20260128-1" />
  <link rel="icon" href="assets/img/logo-quick-delivery.png" type="image/png" />
</head>
<body data-page="login" class="theme-dark theme-minimal bg-soft">
  <nav class="navbar bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <img src="assets/img/logo-quick-delivery.png" alt="Quick Delivery" class="me-1" style="height:24px" />
        Quick Delivery
      </a>
    </div>
  </nav>

  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h1 class="h4 fw-bold mb-2">تسجيل الدخول</h1>
              <p class="text-muted mb-4">سجل الدخول باستخدام الاسم أو رقم الهاتف وكلمة المرور للوصول إلى لوحة التحكم.</p>

              <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>

              <form id="loginForm" novalidate>
                <div class="mb-3">
                  <label class="form-label">الاسم أو رقم الهاتف</label>
                  <input id="username" class="form-control" type="text" autocomplete="username" required />
                </div>

                <div class="mb-3">
                  <label class="form-label">كلمة المرور</label>
                  <div class="input-group">
                    <input id="password" type="password" class="form-control" autocomplete="current-password" required />
                    <button class="btn btn-outline-secondary" type="button" aria-label="إظهار/إخفاء كلمة المرور" data-toggle-password="password">
                      <i class="bi bi-eye"></i>
                    </button>
                  </div>
                </div>

                <div class="form-check mb-3">
                  <input id="rememberMe" class="form-check-input" type="checkbox" checked />
                  <label class="form-check-label" for="rememberMe">تذكرني على هذا الجهاز</label>
                </div>

                <div class="d-flex justify-content-end mb-3">
                  <button id="loginForgotPwBtn" type="button" class="btn btn-link p-0 link-secondary small">نسيت كلمة المرور؟</button>
                </div>

                <button class="btn btn-primary w-100" type="submit">
                  دخول
                </button>
              </form>

              <div class="d-grid gap-2 mt-3">
                <a class="btn btn-outline-secondary" href="signup.html">
                  <i class="bi bi-person-plus ms-1"></i>
                  إنشاء حساب جديد
                </a>
              </div>

            </div>
          </div>

          <div class="text-center mt-3">
            <a href="index.html" class="link-secondary small">العودة للصفحة الرئيسية</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>

  <script src="assets/js/utils.js?v=20260128-1" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="supabase-config.js?v=20260128-1" defer></script>
  <script src="assets/js/supabase.js?v=20260128-1" defer></script>
  <script src="assets/js/auth.js?v=20260128-1" defer></script>
  <script src="assets/js/app.js?v=20260131-1" defer></script>
</body>
</html>
